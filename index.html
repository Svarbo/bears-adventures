<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ми-мимишки Приключения</title>
  <style>
    .loading-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loading-spinner {
      display: flex;
      gap: min(1vw, 1vh);
      align-items: center;
      justify-content: center;
    }

    .dot {
      width: min(2vw, 2vh);
      height: min(2vw, 2vh);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: relative;
      --active: 0;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.5s forwards;
    }

    .dot::before {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      border-radius: 50%;
      opacity: var(--active);
      box-shadow: 0 0 min(0.5vw, 0.5vh) rgba(255, 255, 255, 0.5);
      animation: pulse 1.5s infinite;
      transition: opacity 0.3s ease-out 1.5s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;" oncontextmenu="return false;">
  <canvas id="unity-canvas"
    style="position: fixed; width: 100%; height: 100%; background: #231F20">
  </canvas>

  <div id="loading-container" class="loading-container">
    <div id="loading-spinner" class="loading-spinner">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script src="Build/77972b45333e53cd5fc0e139fc7503b7.loader.js"></script>
  <script>
    const isMobileDevice = navigator.maxTouchPoints > 0 && !!document.createElement('canvas').getContext('webgl')?.getExtension('WEBGL_compressed_texture_etc2');

    const desktopPixelCount = 700000;
    const mobilePixelCount = 700000;

    const settings = {
      arguments: [],
      dataUrl: "Build/4d506cc0e212b23a3fe0c16cd08a6603.data.unityweb",
      frameworkUrl: "Build/28eb5a3bda5dac2ca45814ae23934ad3.framework.js.unityweb",
      codeUrl: "Build/b04f0a0a463285c1070a1e687b81ef17.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "mediatelekim",
      productName: "Ми-мимишки Приключения",
      productVersion: "1.0.0",
      matchWebGLToCanvasSize: false,
      devicePixelRatio: 1,
    };

    const unityCanvas = document.querySelector("#unity-canvas");
    const loadingContainer = document.querySelector("#loading-container");
    const dots = document.querySelectorAll(".dot");

    createUnityInstance(unityCanvas, settings, (progress) => {
      window.unityLoadingProgress = progress;

      const normalizedProgress = Math.min(1, progress / 0.9);
      dots.forEach((dot, index) => {
        const dotProgress = Math.max(0, Math.min(1, (normalizedProgress * 3) - index));
        dot.style.setProperty('--active', dotProgress);
      });
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;

      loadingContainer.style.display = "none";

      function adjustResolution() {
        const targetPixelCount = isMobileDevice ? mobilePixelCount : desktopPixelCount;
        const aspectRatio = window.innerWidth / window.innerHeight;

        let renderHeight = Math.round(Math.sqrt(targetPixelCount / aspectRatio));
        let renderWidth = Math.round(renderHeight * aspectRatio);

        const scale = Math.sqrt(targetPixelCount / (renderWidth * renderHeight));
        renderWidth = Math.round(renderWidth * scale);
        renderHeight = Math.round(renderHeight * scale);
        
        unityCanvas.width = renderWidth;
        unityCanvas.height = renderHeight;
      }

      window.addEventListener('resize', adjustResolution);
      adjustResolution();
    }).catch((errorMessage) => {
      console.error(errorMessage);
      alert(errorMessage);
    });
  </script>
  <script>
// Отключаем навигацию TV-браузера для canvas
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('canvas');
    
    // Блокируем стандартную навигацию браузера
    canvas.addEventListener('keydown', (e) => {
        const tvKeys = [37, 38, 39, 40, 13, 27, 8]; // Стрелки, Enter, Esc, Back
        if (tvKeys.includes(e.keyCode)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }
    }, true); // true = useCapture phase
    
    canvas.addEventListener('keyup', (e) => {
        const tvKeys = [37, 38, 39, 40, 13, 27, 8];
        if (tvKeys.includes(e.keyCode)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }
    }, true);
    
    // Фокус и предотвращение всплытия событий
    canvas.setAttribute('tabindex', '0');
    canvas.style.outline = 'none';
    canvas.focus();
    
    // Возвращаем фокус при клике/касании
    document.addEventListener('click', () => canvas.focus());
    document.addEventListener('touchstart', () => canvas.focus());
});
</script>
</body>

</html>
